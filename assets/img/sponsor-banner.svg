<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120" role="img" aria-label="Sponsor DataTree on GitHub Sponsors">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="598" height="118" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="118" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.55"/>

  <!-- subtle treemap blocks -->
  <g opacity="0.18">
    <rect x="430" y="24" width="54" height="34" rx="4" fill="#06b6d4"/>
    <rect x="492" y="24" width="28" height="34" rx="4" fill="#22d3ee"/>
    <rect x="430" y="64" width="36" height="32" rx="4" fill="#0891b2"/>
    <rect x="474" y="64" width="46" height="32" rx="4" fill="#06b6d4"/>
  </g>

  <!-- folder / tree icon -->
  <g transform="translate(34, 30)" filter="url(#shadow)">
    <path d="M8 10h24l8 10h40a8 8 0 0 1 8 8v34a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V18a8 8 0 0 1 8-8z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M8 18h30l8-8h34v8H8z" fill="#334155"/>
    <rect x="18" y="42" width="18" height="18" rx="3" fill="#06b6d4" opacity="0.9"/>
    <rect x="42" y="42" width="28" height="18" rx="3" fill="#0891b2" opacity="0.75"/>
    <rect x="18" y="64" width="52" height="12" rx="3" fill="#22d3ee" opacity="0.55"/>
  </g>

  <text x="132" y="46" fill="#e2e8f0" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
    Support DataTree
  </text>
  <text x="132" y="76" fill="#94a3b8" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500">
    Sponsor development on GitHub Sponsors
  </text>

  <!-- heart badge -->
  <g transform="translate(500, 36)">
    <rect x="0" y="0" width="72" height="48" rx="12" fill="#1f2937" stroke="#475569" stroke-width="1.5"/>
    <path d="M36 38c-10-7.5-18-13.5-18-21.5 0-5 3.8-9 8.8-9 4.2 0 6.7 2.4 9.2 5.5 2.5-3.1 5-5.5 9.2-5.5 5 0 8.8 4 8.8 9 0 8-8 14-18 21.5z" fill="url(#heart)"/>
  </g>
</svg>
